services:
  db:
    image: docker.io/library/postgres:${PYTEST_PG_VERSION:-9.3}-alpine
    tty: false
    stdin_open: false
    secrets:
      - odoo_db_password
    environment:
      POSTGRES_DB: odoodb
      POSTGRES_PASSWORD_FILE: /run/secrets/odoo_db_password
      POSTGRES_USER: odoo
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    hostname: odoo-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoodb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  odoo:
    image: localhost/test:docker-isodoo-demo-${PYTEST_ODOO_VERSION:-6.0}
    pull_policy: never
    tty: false
    stdin_open: false
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
      - '127.0.0.1:8069:8069'
    secrets:
      - odoo_db_password
    environment:
      OCONF__options__log_level: debug
      OCONF__options__db_filter: odoodb$
      OCONF__options__db_user: odoo
      FOCONF__options__db_password: /run/secrets/odoo_db_password
      OCONF__options__db_host: odoo-db
      OCONF__options__db_name: odoodb
      OCONF__options__proxy_mode: false
      OCONF__options__workers: 0
      OCONF__options__max_cron_threads: 0
      OCONF__options__without_demo: all
    hostname: odoo

secrets:
  odoo_db_password:
    x-podman.relabel: Z
    file: ./secrets/odoo_db_password.txt
